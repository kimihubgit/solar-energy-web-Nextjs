name: CI / CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # -----------------------------------------------------------
  # 1. CI (Continuous Integration): Lint, TypeCheck, and Build
  # -----------------------------------------------------------
  ci:
    name: Lint, TypeCheck & Build
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🔍 ESLint Check
        run: npm run lint

      - name: 🛡️ TypeScript Verification
        run: npx tsc --noEmit

      - name: ⚡ Build Next.js Production App
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://thego.starwar.vn
